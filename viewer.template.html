<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BA Bus 沟通梳理</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
  --fg:#e6e9ef; --fg2:#a8b0c0; --fg3:#6f7889;
  --acc:#5b9dff;
  --dec:#4c6ef5; --hand:#0ca678; --fyi:#868e96; --q:#ae3ec9; --blk:#e03131;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:ui-monospace,Consolas,monospace;font-size:.92em}
header{padding:28px 32px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#161a22,#0f1115)}
h1{margin:0 0 6px;font-size:22px;letter-spacing:.3px}
.sub{color:var(--fg2);font-size:13px}
.sub b{color:var(--fg)}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px 64px}
section{margin:34px 0 0}
h2{font-size:16px;margin:0 0 14px;padding-left:10px;border-left:3px solid var(--acc);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.h2btn{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--fg3);
  border-radius:6px;padding:2px 9px;font-size:11.5px;font-weight:400;cursor:pointer;
  line-height:1.6;letter-spacing:0}
.h2btn:hover{color:var(--fg);border-color:var(--fg3);background:var(--panel2)}
h3{font-size:14px;margin:20px 0 10px;color:var(--fg2)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(auto-fit,minmax(560px,1fr))}
@media(max-width:900px){.g4,.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.stat .n{font-size:30px;font-weight:650;line-height:1.1;
  background:linear-gradient(180deg,#fff,#9fb6d8);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent}
.stat .l{color:var(--fg3);font-size:12px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--fg3);font-weight:600;font-size:12px;text-transform:uppercase;
  letter-spacing:.4px}
tbody tr:hover{background:var(--panel2)}
.bar{height:8px;background:var(--acc);border-radius:4px;display:inline-block;
  vertical-align:middle}
.mono{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--fg3);
  display:inline-block;max-width:190px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;vertical-align:bottom}
.bar{height:8px;background:var(--acc);border-radius:4px;display:inline-block;
  vertical-align:middle}
.chip{display:inline-block;padding:1px 8px;margin:1px 3px 1px 0;border-radius:20px;
  background:#252a35;border:1px solid var(--line);color:var(--fg2);font-size:12px;
  white-space:nowrap}
.chip.known{background:#1d2b45;border-color:#2f4a7a;color:#bcd4ff}
.chip.none{color:var(--fg3);font-style:italic}
.cc{margin-left:8px;font-size:12px;color:var(--fg3)}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;margin:10px 0}
.msg-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.idx{color:var(--fg3);font-size:12px;font-variant-numeric:tabular-nums}
.t-decision,.t-handoff,.t-fyi,.t-question,.t-blocker,.t-status,
.t-contract-ack,.t-contract-change,.t-decision-request,.t-registration,
.t-offer,.t-unknown{padding:1px 9px;border-radius:5px;font-size:12px;
  font-weight:600}
.t-decision{background:rgba(76,110,245,.18);color:#91a7ff}
.t-handoff{background:rgba(12,166,120,.18);color:#63e6be}
.t-fyi{background:rgba(134,142,150,.16);color:#b6bdc8}
.t-question{background:rgba(174,62,201,.18);color:#da8fff}
.t-blocker{background:rgba(224,49,49,.18);color:#ff8787}
.t-status{background:rgba(255,169,77,.16);color:#ffc078}
.t-contract-ack{background:rgba(81,207,102,.16);color:#8ce99a}
.t-contract-change{background:rgba(255,169,77,.16);color:#ffc078}
.t-decision-request{background:rgba(76,110,245,.16);color:#91a7ff}
.t-registration,.t-offer{background:rgba(91,157,255,.16);color:#a5c8ff}
.t-unknown{background:#2a2f3a;color:var(--fg3)}
.pri{padding:1px 8px;border-radius:5px;font-size:12px;font-weight:600}
.pri-p0{background:rgba(255,107,107,.16);color:#ff8787}
.pri-p1{background:rgba(255,169,77,.16);color:#ffc078}
.pri-p2{background:rgba(81,207,102,.14);color:#8ce99a}
.pri-p3{background:rgba(134,142,150,.16);color:#b6bdc8}
.pri-none{background:#252a35;color:var(--fg3)}
.mid{color:var(--fg3);font-size:12px;font-family:ui-monospace,Consolas,monospace}
a.mid{color:var(--fg3);text-decoration:none;border-bottom:1px dotted var(--line);cursor:pointer}
a.mid:hover{color:var(--acc);border-bottom-color:var(--acc)}
/* 待结清里的 id 是明确的跳转入口，用强调色标出来 */
a.mid-jump{color:var(--acc);border-bottom:1px dashed var(--acc);font-weight:500}
a.mid-jump:hover{color:#a5c8ff}
a.rel{color:var(--fg3);text-decoration:none;border-bottom:1px dotted var(--line);cursor:pointer}
a.rel:hover{color:var(--acc);border-bottom-color:var(--acc)}
/* 跳转目标高亮：锚点命中时闪一下并保留描边 */
@keyframes msgFlash{0%{background:rgba(91,157,255,.22)}100%{background:var(--panel)}}
.msg{scroll-margin-top:16px}
.msg:target,.msg.jump-flash{outline:2px solid var(--acc);outline-offset:2px;animation:msgFlash 1.4s ease-out}
.time{color:var(--fg3);font-size:12px;margin-left:auto}
.decl{color:#ffc078;font-size:11px;margin-left:2px;cursor:help}
/* v2 消息格式：expect / re / result 标签 */
.exp{font-size:11.5px;padding:1px 7px;border-radius:5px;border:1px solid var(--line);
  background:#252a35;color:var(--fg2);white-space:nowrap}
.exp-open{border-color:#6b4a2f;background:#322616;color:#ffc078}
.exp-done{border-color:#2f6b4a;background:#16321f;color:#8ce99a}
.exp-x{margin-left:6px;padding:0 4px;border-radius:3px;font-size:10px;
  background:rgba(255,255,255,.1);color:inherit;opacity:.85}
.rel{font-size:11.5px;color:var(--fg3);font-family:ui-monospace,Consolas,monospace}
.gen{font-size:11px;color:var(--fg3);border:1px dashed var(--line);border-radius:5px;
  padding:0 6px;white-space:nowrap}
.res-ok{color:#8ce99a;font-size:11.5px}
.res-no{color:#ff8787;font-size:11.5px}
.msg-route{align-items:center;margin-bottom:6px}
.arrow{color:var(--fg3);margin:0 6px}
.ref{color:var(--fg3);font-size:12px;font-family:ui-monospace,Consolas,monospace;
  word-break:break-all;margin:2px 0}
pre.body{margin:8px 0 6px;padding:12px 14px;background:#11141a;
  border:1px solid var(--line);border-radius:8px;white-space:pre-wrap;
  word-break:break-word;font:12.5px/1.65 ui-monospace,Consolas,monospace;
  color:#cfd6e4}
.msg-foot{display:flex;gap:12px;align-items:baseline;font-size:12px;color:var(--fg3)}
.subj{color:var(--fg3);opacity:.8;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.thread{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  margin:10px 0;overflow:hidden}
.thread-head{padding:11px 16px;background:var(--panel2);
  border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;
  align-items:center;cursor:pointer;user-select:none}
.thread-head:hover{background:#252a35}
.thread-body{padding:4px 8px 8px}
.hidden{display:none !important}
.tcount{color:var(--fg3);font-size:12px;margin-left:auto}
.collapsed .thread-body{display:none}
.tarrow{color:var(--fg3);transition:transform .15s}
.collapsed .tarrow{transform:rotate(-90deg)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
input[type=search]{background:#11141a;border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;color:var(--fg);font-size:13px;min-width:260px;flex:1}
.ledger{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--fg3)}
#cnt{color:var(--fg2);font-variant-numeric:tabular-nums}
.note{color:var(--fg3);font-size:12px;margin-top:8px;line-height:1.7}
.badge{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11.5px;
  border:1px solid var(--line);background:#252a35;color:var(--fg2)}
.badge.live{border-color:#2f6b4a;background:#16321f;color:#8ce99a}
.badge.stale{border-color:#6b4a2f;background:#322616;color:#ffc078}
.loadbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
button{background:#252a35;border:1px solid var(--line);color:var(--fg);
  border-radius:7px;padding:6px 12px;font-size:12.5px;cursor:pointer}
button:hover{background:#2f3644}
#err{display:none;background:rgba(224,49,49,.12);border:1px solid #6b2b2b;
  color:#ff8787;padding:10px 14px;border-radius:8px;margin-top:12px;font-size:13px}
#back-to-top{position:fixed;right:24px;bottom:24px;z-index:20;width:48px;height:48px;
  display:grid;place-items:center;padding:0;border:1px solid #3a4658;border-radius:50%;
  background:#202938;color:var(--fg);box-shadow:0 6px 20px rgba(0,0,0,.35);
  opacity:0;visibility:hidden;transform:translateY(8px);
  transition:opacity .18s ease,transform .18s ease,visibility .18s}
#back-to-top.visible{opacity:1;visibility:visible;transform:translateY(0)}
#back-to-top:hover{background:#2a3b54;border-color:var(--acc)}
#back-to-top:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
@media(max-width:600px){#back-to-top{right:16px;bottom:16px;width:46px;height:46px}}
@media(prefers-reduced-motion:reduce){#back-to-top{transition:none}}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
#open-chat{display:inline-flex;align-items:center;gap:8px;min-height:40px;border-color:#35517a;
  background:#1d2a3d;color:#bcd4ff}
#open-chat:hover{background:#263a56}
#chat-view{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  margin:0;background:var(--bg)}
body.chat-open{overflow:hidden}
body.chat-open #back-to-top{display:none}
.chat-top{flex:none;padding:14px 24px 12px;border-bottom:1px solid var(--line);
  background:#151922;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.chat-topline{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px}
#close-chat{min-width:40px;min-height:40px;padding:0;font-size:20px}
.chat-heading{min-width:0;flex:1}
.chat-heading h2{margin:0;padding:0;border:0;font-size:17px}
.chat-heading p{margin:2px 0 0;color:var(--fg3);font-size:12px}
#chat-count{color:var(--fg2);font-variant-numeric:tabular-nums;font-size:12px}
.chat-participants{max-width:1120px;margin:12px auto 0;display:flex;gap:8px;overflow-x:auto;
  padding:2px 1px 6px;scrollbar-width:thin}
.chat-agent{flex:none;min-height:38px;padding:6px 12px;border-radius:20px;color:var(--fg2);
  background:#1b202a;border-color:#303744}
.chat-agent.active{color:#e7f0ff;border-color:#4a76b7;background:#243b5c}
.chat-tools{max-width:1120px;margin:8px auto 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#chat-search{max-width:420px;min-width:160px;flex:1}
#chat-selection{font-size:12px;color:var(--fg3);margin-left:auto}
#chat-refresh-status{font-size:11px;color:var(--fg3)}
#chat-reload{min-height:36px;padding:5px 10px}
#chat-scroll{position:relative;flex:1;overflow:auto;overscroll-behavior:contain;padding:20px 24px 28px}
.chat-bottom{flex:none;border-top:1px solid var(--line);background:#151922;padding:10px 24px calc(10px + env(safe-area-inset-bottom))}
.chat-bottom-inner{max-width:920px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
#chat-bottom-hint{color:var(--fg3);font-size:11px}
#chat-latest{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;
  padding:7px 16px;border:1px solid #416993;border-radius:999px;background:#203754;color:#d5e7ff;
  box-shadow:0 4px 14px rgba(0,0,0,.24);font-size:12px;font-weight:650}
#chat-latest:hover{background:#29486b;border-color:#6ca9ef}
#chat-latest.at-latest{background:#1b242e;border-color:#343e4c;color:#9ca8b8;box-shadow:none}
#chat-latest.has-new{border-color:#4f9d78;background:#1d4938;color:#d8ffea}
#chat-latest svg{flex:none}
.chat-agent{display:inline-flex;align-items:center;gap:7px}
.chat-agent-avatar{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;
  background:hsl(var(--agent-hue) 38% 27%);color:hsl(var(--agent-hue) 75% 85%);font-size:10px;font-weight:700}
.chat-agent-count{color:var(--fg3);font-size:10px}
.chat-agent.active .chat-agent-count{color:#a7c8f3}
.chat-meta .chat-agent-name{display:inline-flex;align-items:baseline;gap:6px;padding:0;border:0;
  background:transparent;color:var(--fg);font:inherit;font-size:13px;font-weight:700;text-align:left}
.chat-meta .chat-agent-name[data-chat-agent]{cursor:pointer}
.chat-meta .chat-agent-name[data-chat-agent]:hover .chat-agent-label{color:var(--acc)}
.chat-agent-id{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--fg3);font:10px ui-monospace,Consolas,monospace}
.chat-meta time{color:var(--fg3)}
.chat-type{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;white-space:nowrap}
.chat-type-icon{font-size:11px;line-height:1}
#chat-messages{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.chat-empty{margin:auto;color:var(--fg3);padding:48px 16px;text-align:center}
.chat-row{display:flex;align-items:flex-end;gap:9px;max-width:min(78%,760px)}
.chat-row.mine{align-self:flex-end;flex-direction:row-reverse}
.chat-avatar{flex:none;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;
  background:hsl(var(--agent-hue) 38% 27%);color:hsl(var(--agent-hue) 75% 85%);
  font-size:12px;font-weight:700}
.chat-content{min-width:0}
.chat-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin:0 4px 4px;color:var(--fg3);font-size:11px}
.chat-row.mine .chat-meta{justify-content:flex-end}
.chat-bubble{padding:10px 13px;border:1px solid var(--line);border-radius:14px 14px 14px 4px;
  background:#1b202a;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.chat-row.mine .chat-bubble{border-color:#31517a;border-radius:14px 14px 4px 14px;background:#1c2c42}
.chat-bubble .body{margin:0;padding:0;border:0;background:transparent;color:var(--fg);
  font:inherit;font-size:13px;line-height:1.7;white-space:normal;overflow-wrap:anywhere}
.markdown-body> :first-child{margin-top:0}
.markdown-body> :last-child{margin-bottom:0}
.markdown-body p{margin:0 0 9px}
.markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4{display:block;margin:16px 0 8px;padding:0;border:0;
  color:#f0f4fc;line-height:1.35;letter-spacing:0}
.markdown-body h1{font-size:19px}.markdown-body h2{font-size:17px}.markdown-body h3{font-size:15px}.markdown-body h4{font-size:14px}
.markdown-body strong{color:#fff;font-weight:700}
.markdown-body em{color:#d8e4f5}
.markdown-body a{color:#8dbdff;text-decoration:underline;text-decoration-color:#52729d;text-underline-offset:2px}
.markdown-body ul,.markdown-body ol{margin:5px 0 10px;padding-left:23px}
.markdown-body li{padding-left:2px;margin:3px 0}
.markdown-body blockquote{margin:9px 0;padding:7px 12px;border-left:3px solid #577da9;
  border-radius:0 6px 6px 0;background:rgba(91,157,255,.08);color:#bdc9da}
.markdown-body blockquote p{margin:0}
.markdown-body hr{height:1px;margin:12px 0;border:0;background:var(--line)}
.markdown-table-wrap{max-width:100%;margin:10px 0;overflow-x:auto;border:1px solid var(--line);border-radius:7px}
.markdown-body table{width:100%;border-collapse:collapse;font-size:12px}
.markdown-body th,.markdown-body td{min-width:90px;padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
.markdown-body th{background:#202631;color:#c8d4e6;font-size:11px;text-transform:none;letter-spacing:0}
.markdown-body tr:last-child td{border-bottom:0}
.markdown-body code{padding:1px 5px;border:1px solid #343b49;border-radius:5px;background:#12161d;
  color:#c4dcff;font:12px/1.55 ui-monospace,Consolas,monospace}
.markdown-body pre{margin:9px 0;padding:11px 12px;overflow:auto;border:1px solid #303746;border-radius:8px;
  background:#11151c;color:#d4deed;line-height:1.6}
.markdown-body pre code{padding:0;border:0;background:none;color:inherit;white-space:pre;font-size:11.5px}
.chat-details{display:flex;flex-wrap:wrap;gap:8px;margin-top:7px;color:var(--fg3);font-size:10.5px}
.chat-details a{color:var(--fg3)}
@media(max-width:700px){
  .chat-top{padding:10px 12px 8px}.chat-scroll{padding:16px 12px 24px}
  .chat-row{max-width:92%}.chat-tools{gap:8px}.chat-heading p{font-size:11px}
  .chat-scroll{padding:16px 12px 24px}.chat-bottom{padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
  #chat-bottom-hint{display:none}.chat-bottom-inner{justify-content:center}
  #chat-latest{width:min(100%,360px)}#chat-count{display:none}
}
</style>
</head>
<body>
<header>
  <div class="header-top">
    <h1>BA Bus 沟通梳理</h1>
    <button id="open-chat" type="button" aria-haspopup="dialog">
      <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>
      聊天窗口
    </button>
  </div>
  <div class="sub">
    <span id="hd-meta">加载中…</span>
  </div>
  <div class="loadbar">
    <span id="src-badge" class="badge">数据源：—</span>
    <span id="gen-badge" class="badge">生成时间：—</span>
    <button id="reload" title="服务端会增量 fetch 一次 bus 分支">刷新数据</button>
  </div>
</header>
<div class="wrap">
  <div id="err"></div>

  <section>
    <h2>总览</h2>
    <div class="grid g4">
      <div class="card stat"><div class="n" id="s-msg">—</div><div class="l">bus 消息总数</div></div>
      <div class="card stat"><div class="n" id="s-thread">—</div><div class="l">沟通 thread（话题）</div></div>
      <div class="card stat"><div class="n" id="s-agent">—</div><div class="l">参与 Agent</div></div>
      <div class="card stat"><div class="n" id="s-top">—</div><div class="l">发出最多的 Agent</div></div>
      <div class="card stat"><div class="n" id="s-open">—</div><div class="l">待结清（欠回复）</div></div>
    </div>
    <div class="note" id="s-note"></div>
  </section>

  <section id="sec-pending">
    <h2>待结清 <span id="p-count" style="color:var(--fg3);font-size:12px;font-weight:400"></span>
      <button id="p-toggle" class="h2btn" type="button" aria-expanded="true"
              title="收起「待结清」，需要时再展开">收起</button>
    </h2>
    <div id="pending"></div>
    <div class="note" id="p-note"></div>
  </section>

  <section>
    <h2>参与者</h2>
    <div class="grid g2">
      <div class="card"><table id="tb-agents"></table></div>
      <div class="card"><table id="tb-edges"></table></div>
    </div>
  </section>

  <section>
    <h2>消息类型与节奏</h2>
    <div class="grid g3">
      <div class="card"><h3>类型</h3><table id="tb-type"></table></div>
      <div class="card"><h3>优先级</h3><table id="tb-pri"></table></div>
      <div class="card"><h3>每日消息量</h3><table id="tb-day"></table></div>

<!-- 数据文件名：外部数据按需注入（实时模式不下载快照，避免双份传输） -->
<script>window.__BUS_DATA_FILE__ = "{{DATA_FILE}}";</script>
<!-- 内嵌快照：所有外部数据都拿不到时的兜底 -->
<script id="bus-data-embedded" type="application/json">{{EMBEDDED_JSON}}</script>
<script>
(function () {
  "use strict";

  var TYPE_CN = {
    decision: "裁决", handoff: "交付交接", fyi: "知会", question: "提问",
    blocker: "阻塞", status: "状态", "contract-ack": "契约确认",
    "contract-change": "契约变更", "decision-request": "裁决请求",
    registration: "注册", offer: "接单意向", unknown: "未分类"
  };
  var TYPE_CLASS = {
    decision: "t-decision", handoff: "t-handoff", fyi: "t-fyi", question: "t-question",
    blocker: "t-blocker", status: "t-status", "contract-ack": "t-contract-ack",
    "contract-change": "t-contract-change", "decision-request": "t-decision-request",
    registration: "t-registration", offer: "t-offer", unknown: "t-unknown"
  };
  var TYPE_ICON = {
    decision: "◆", handoff: "↗", fyi: "i", question: "?", blocker: "!",
    status: "●", "contract-ack": "✓", "contract-change": "Δ",
    "decision-request": "⚖", registration: "+", offer: "↗", unknown: "·"
  };
  var PRI_CN = { p0: "P0 最高", p1: "P1", p2: "P2", p3: "P3", "": "—" };
  var EXPECT_CN = { none: "无需回复", ack: "需回执", reply: "需回复", "": "—" };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function renderMarkdown(source) {
    var inline = function (value) {
      var codes = [];
      var text = esc(value).replace(/`([^`\n]+)`/g, function (_, code) {
        var key = "\u0000CODE" + codes.length + "\u0000";
        codes.push("<code>" + code + "</code>");
        return key;
      });
      text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (all, label, url) {
        if (!/^(https?:\/\/|mailto:)/i.test(url)) return label;
        var key = "\u0000LINK" + codes.length + "\u0000";
        codes.push('<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + '</a>');
        return key;
      });
      text = text.replace(/\*\*(.+?)\*\*|__(.+?)__/g, function (_, a, b) { return "<strong>" + (a || b) + "</strong>"; });
      text = text.replace(/~~(.+?)~~/g, "<del>$1</del>");
      text = text.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
      text = text.replace(/\n/g, "<br>");
      return text.replace(/\u0000(?:CODE|LINK)(\d+)\u0000/g, function (_, index) { return codes[Number(index)]; });
    };
    var lines = String(source == null ? "" : source).replace(/\r\n?/g, "\n").split("\n");
    var out = [], paragraph = [], list = "", quote = [], code = null, consumedTableLines = {};
    function flushParagraph() {
      if (paragraph.length) out.push("<p>" + inline(paragraph.join("\n")) + "</p>");
      paragraph = [];
    }
    function closeList() {
      if (list) out.push("</" + list + ">");
      list = "";
    }
    function flushQuote() {
      if (quote.length) out.push("<blockquote><p>" + inline(quote.join("\n")) + "</p></blockquote>");
      quote = [];
    }
    function tableCells(row) {
      return row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (cell) {
        return cell.trim();
      });
    }
    var tableSeparator = /^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/;
    lines.forEach(function (line, lineIndex) {
      if (code) {
        if (/^\s*```/.test(line)) {
          var languageClass = code.language ? ' class="language-' + esc(code.language) + '"' : "";
          out.push("<pre><code" + languageClass + ">" + esc(code.lines.join("\n")) + "</code></pre>");
          code = null;
        } else code.lines.push(line);
        return;
      }
      if (consumedTableLines[lineIndex]) return;
      var fence = line.match(/^\s*```([\w+-]*)\s*$/);
      if (fence) {
        flushParagraph(); closeList(); flushQuote();
        code = { language: fence[1], lines: [] };
        return;
      }
      if (line.indexOf("|") >= 0 && lines[lineIndex + 1] && tableSeparator.test(lines[lineIndex + 1])) {
        flushParagraph(); closeList(); flushQuote();
        var headers = tableCells(line);
        var tableHtml = '<div class="markdown-table-wrap"><table><thead><tr>' +
          headers.map(function (cell) { return "<th>" + inline(cell) + "</th>"; }).join("") +
          "</tr></thead><tbody>";
        var rowIndex = lineIndex + 2;
        consumedTableLines[lineIndex] = true;
        consumedTableLines[lineIndex + 1] = true;
        while (rowIndex < lines.length && lines[rowIndex].indexOf("|") >= 0 && lines[rowIndex].trim()) {
          consumedTableLines[rowIndex] = true;
          var cells = tableCells(lines[rowIndex]);
          while (cells.length < headers.length) cells.push("");
          tableHtml += "<tr>" + headers.map(function (_, cellIndex) {
            return "<td>" + inline(cells[cellIndex] || "") + "</td>";
          }).join("") + "</tr>";
          rowIndex++;
        }
        out.push(tableHtml + "</tbody></table></div>");
        lineIndex = rowIndex - 1;
        return;
      }
      var heading = line.match(/^\s*(#{1,6})\s+(.+?)\s*#*\s*$/);
      var unordered = line.match(/^\s*[-*+]\s+(.+)$/);
      var ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
      var quoteLine = line.match(/^\s*>\s?(.*)$/);
      if (heading) {
        flushParagraph(); closeList(); flushQuote();
        var level = heading[1].length;
        out.push("<h" + level + ">" + inline(heading[2]) + "</h" + level + ">");
      } else if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) {
        flushParagraph(); closeList(); flushQuote(); out.push("<hr>");
      } else if (quoteLine) {
        flushParagraph(); closeList(); quote.push(quoteLine[1]);
      } else if (unordered || ordered) {
        flushParagraph(); flushQuote();
        var nextList = unordered ? "ul" : "ol";
        if (list && list !== nextList) closeList();
        if (!list) { list = nextList; out.push("<" + list + ">"); }
        out.push("<li>" + inline((unordered || ordered)[1]) + "</li>");
      } else if (!line.trim()) {
        flushParagraph(); closeList(); flushQuote();
      } else {
        closeList(); flushQuote(); paragraph.push(line);
      }
    });
    if (code) {
      var finalLanguage = code.language ? ' class="language-' + esc(code.language) + '"' : "";
      out.push("<pre><code" + finalLanguage + ">" + esc(code.lines.join("\n")) + "</code></pre>");
    }
    flushParagraph(); closeList(); flushQuote();
    return out.join("");
  }

  var state = { data: null, agentsById: {}, search: "", only: false, desc: true,
                pendingCollapsed: false, pendingOpen: 0, chatAgent: "", chatSearch: "",
                chatHasNew: false, refreshing: false };

  // 展示顺序：默认最新在前。按消息时间（at）排序，同一时间保持原提交顺序。
  // 不能直接 reverse 数组：author date 与提交顺序并不总是一致（转述/补发会倒挂）。
  function ordered() {
    var items = (state.data ? state.data.messages : []).map(function (m, k) {
      return { m: m, k: k, t: Date.parse(m.at) || 0 };
    });
    items.sort(function (a, b) {
      return state.desc
        ? (b.t - a.t) || (b.k - a.k)
        : (a.t - b.t) || (a.k - b.k);
    });
    items.forEach(function (x, i) { x.i = i + 1; });
    return items;
  }

  // ── 取数据：外部 bus-data.js 优先，失败回退内嵌
  function pickData() {
    if (window.__BUS_DATA__ && window.__BUS_DATA__.messages) {
      return { data: window.__BUS_DATA__, source: "external" };
    }
    try {
      var el = document.getElementById("bus-data-embedded");
      var parsed = JSON.parse(el.textContent || "{}");
      if (parsed.messages) return { data: parsed, source: "embedded" };
    } catch (e) { /* 内嵌解析失败 */ }
    return { data: null, source: "none" };
  }

  // 时间统一按北京时间（UTC+8）展示。
  // 服务端已输出 +08:00，这里再折算一次：不论数据是 Z 还是别的偏移（旧服务 / 旧快照），
  // 都能正确显示成北京时间。
  var CN_OFFSET = 8 * 3600 * 1000;

  function fmtTime(at) {
    if (at == null || at === "") return "";
    var t = Date.parse(at);
    if (isNaN(t)) return String(at);
    var d = new Date(t + CN_OFFSET);
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getUTCFullYear() + "-" + p(d.getUTCMonth() + 1) + "-" + p(d.getUTCDate()) +
      " " + p(d.getUTCHours()) + ":" + p(d.getUTCMinutes()) + ":" + p(d.getUTCSeconds());
  }

  function fmtShort(at) {
    return fmtTime(at).slice(5, 16); // MM-DD HH:MM
  }

  function dayKey(at) {
    return fmtTime(at).slice(0, 10); // 北京日期，跨零点不会落错天
  }

  // 消息体里手写的 at 与真实提交时间不一致时，用 * 标注并给出两者（悬停可见）。
  // 只标 >= 1 分钟的差：秒级差异多半只是取整，标出来是噪音。
  function timeCell(m) {
    var dt = m.declaredAt ? Date.parse(m.declaredAt) : NaN;
    var at = Date.parse(m.at);
    var mismatch = !isNaN(dt) && !isNaN(at) && Math.abs(dt - at) >= 60000;
    var title = mismatch
      ? ' title="提交时间 ' + esc(fmtTime(m.at)) + '；消息体声明 ' +
        esc(fmtTime(m.declaredAt)) + '。时间线以提交时间为准。"'
      : "";
    return '<span class="time"' + title + ">" + esc(fmtTime(m.at)) +
      (mismatch ? '<span class="decl">*</span>' : "") + "</span>";
  }

  function chip(id) {
    if (id === "all") {
      return '<span class="chip none" title="广播到全体">全体</span>';
    }
    if (id === "unknown") {
      return '<span class="chip none" title="消息头部缺失或不完整">（未署名）</span>';
    }
    if (String(id).indexOf("role:") === 0) {
      return '<span class="chip none" title="按角色广播">角色 ' +
        esc(String(id).slice(5)) + "</span>";
    }
    var a = state.agentsById[id];
    var label = a ? a.label : id;
    var known = a ? " known" : "";
    return '<span class="chip' + known + '" title="' + esc(id) + '">' + esc(label) + "</span>";
  }

  // 各 type 的默认反馈义务（与 aw.py EXPECT_DEFAULT 一致）。
  // expect 可以被发送方显式覆盖：fyi + expect=ack 这种「知会但要求回执」是合法写法，
  // 只是和类型默认不一致，页面要标出来，否则看着像报告算错了。
  var EXPECT_DEFAULT = {
    fyi: "none", decision: "none", "contract-ack": "none",
    question: "reply", blocker: "reply", handoff: "reply", "contract-change": "ack"
  };

  function expectIsExplicit(m) {
    var def = EXPECT_DEFAULT[m.type] || "none";
    return !!(m.expect && m.expect !== "none" && m.expect !== def);
  }

  // v2：反馈义务标签。已结清（有人用 re: <id> 回过）为绿色，未结清为橙色。
  function expChip(m) {
    if (!m.expect || m.expect === "none") return "";
    var done = !!m.settledBy;
    var explicit = expectIsExplicit(m);
    var title = done ? "已由消息 " + m.settledBy + " 结清" : "尚无 re 回执";
    if (m.reply_by) title += "；期望回复：" + m.reply_by;
    if (explicit) {
      title += "；该类型默认 expect=" + (EXPECT_DEFAULT[m.type] || "none") +
        "，本条由发送方显式要求 " + m.expect;
    }
    return '<span class="exp ' + (done ? "exp-done" : "exp-open") + '" title="' +
      esc(title) + '">' + esc(EXPECT_CN[m.expect] || m.expect) +
      (done ? " ✓" : " ⏳") +
      (explicit ? '<span class="exp-x">显式</span>' : "") + "</span>";
  }

  function multiGen() {
    return !!(state.data && state.data.meta.generations &&
      state.data.meta.generations.length > 1);
  }

  function msgCard(m, i, compact) {
    var body = m.body || m.subject || "";
    var t = TYPE_CN[m.type] || m.type;
    var p = PRI_CN[m.priority] || m.priority || "—";
    var href = m.url && m.url.indexOf("http") === 0
      ? '<a href="' + esc(m.url) + '" target="_blank" rel="noopener">' + esc(m.sha.slice(0, 12)) + "</a>"
      : '<span>' + esc(m.sha.slice(0, 12)) + "</span>";
    // 时间线里的卡片带锚点，供 id / re 跳转；thread 里的副本不重复占用锚点
    var anchor = compact && m.id ? ' id="m-' + esc(m.id) + '"' : "";
    return '<div class="msg"' + anchor + (compact ? ' style="margin:6px 0"' : "") + '>' +
      '<div class="msg-head">' +
      '<span class="idx">#' + i + "</span>" +
      '<span class="t-' + esc(m.type || "unknown") + '">' + esc(t) + "</span>" +
      '<span class="pri pri-' + esc(m.priority || "none") + '">' + esc(p) + "</span>" +
      expChip(m) +
      (multiGen() && m.generation
        ? '<span class="gen" title="所属 bus 代">' + esc(m.generation) + "</span>"
        : "") +
      (m.id
        ? '<a class="mid" href="#m-' + esc(m.id) + '" title="跳到时间线里的这条消息">id ' +
          esc(m.id) + "</a>"
        : '<span class="mid">id —</span>') +
      timeCell(m) +
      "</div>" +
      '<div class="msg-route">' + chip(m.from) +
      '<span class="arrow">&rarr;</span>' +
      (m.to && m.to.length
        ? m.to.map(chip).join("")
        : '<span class="chip none">（广播/无指定收件人）</span>') +
      (m.cc && m.cc.length
        ? '<span class="cc">cc ' + m.cc.map(chip).join("") + "</span>"
        : "") +
      "</div>" +
      (m.ref ? '<div class="ref">ref: ' + esc(m.ref) + "</div>" : "") +
      (m.thread ? '<div class="ref">thread: ' + esc(m.thread) + "</div>" : "") +
      '<pre class="body">' + esc(body) + "</pre>" +
      '<div class="msg-foot">' + href +
      (m.re
        ? '<a class="rel" href="#m-' + esc(m.re) + '" title="跳到被回复的那条消息">↩ re ' +
          esc(m.re) + "</a>"
        : "") +
      (m.result
        ? '<span class="' + (m.result === "ok" ? "res-ok" : "res-no") + '">result ' +
          esc(m.result) + "</span>"
        : "") +
      '<span class="subj">' + esc(m.subject) + "</span></div></div>";
  }

  function table(el, head, rows) {
    var h = "<thead><tr>" +
      head.map(function (x) { return "<th>" + esc(x) + "</th>"; }).join("") +
      "</tr></thead><tbody>";
    rows.forEach(function (r) {
      h += "<tr>" + r.map(function (c) {
        return "<td>" + c + "</td>";
      }).join("") + "</tr>";
    });
    el.innerHTML = h + "</tbody>";
  }

  function barTable(el, counter, labelMap) {
    var items = Object.keys(counter).map(function (k) { return [k, counter[k]]; });
    items.sort(function (a, b) { return b[1] - a[1]; });
    var max = items.length ? items[0][1] : 1;
    var h = "<tbody>";
    items.forEach(function (e) {
      var w = Math.round((e[1] * 100) / max);
      h += '<tr><td style="width:40%">' + esc(labelMap ? (labelMap[e[0]] || e[0]) : e[0]) +
        '</td><td style="width:10%"><b>' + e[1] + "</b></td>" +
        '<td><span class="bar" style="width:' + w + '%"></span></td></tr>';
    });
    el.innerHTML = h + "</tbody>";
  }

  function renderAgents() {
    var rows = state.data.agents.map(function (a) {
      return [
        "<b>" + esc(a.label) + "</b>",
        '<span class="mono">' + esc(a.id) + "</span>",
        String(a.sent),
        String(a.received),
        a.role
          ? '<span style="color:var(--fg2)">' + esc(a.role) + "</span>"
          : '<span style="color:var(--fg3)">—</span>',
      ];
    });
    table(document.getElementById("tb-agents"),
      ["Agent", "稳定 ID", "发出", "收到", "角色"], rows);

    var erows = state.data.agents.map(function (a) {
      var top = a.primary.map(function (p) {
        var t = state.agentsById[p.id];
        return esc(t ? t.label : p.id) + " <b>" + p.count + "</b>";
      }).join("　");
      return ["<b>" + esc(a.label) + "</b>",
        top || '<span style="color:var(--fg3)">—</span>'];
    });
    table(document.getElementById("tb-edges"), ["发送方", "主要收件方（条数）"], erows);
  }

  function renderStats() {
    var msgs = state.data.messages;
    var types = {}, pris = {}, days = {}, threads = {};
    msgs.forEach(function (m) {
      types[m.type || "unknown"] = (types[m.type || "unknown"] || 0) + 1;
      pris[m.priority || ""] = (pris[m.priority || ""] || 0) + 1;
      var d = dayKey(m.at);
      days[d] = (days[d] || 0) + 1;
      var k = m.thread || "(no-thread)";
      threads[k] = (threads[k] || 0) + 1;
    });
    barTable(document.getElementById("tb-type"), types, TYPE_CN);
    barTable(document.getElementById("tb-pri"), pris, PRI_CN);
    barTable(document.getElementById("tb-day"), days, null);
  }

  // 取一组消息里时间最早 / 最晚的那条（与展示顺序无关）
  function pickEdge(arr, newest) {
    var best = arr[0], bestT = Date.parse(arr[0].m.at) || 0;
    arr.forEach(function (x) {
      var t = Date.parse(x.m.at) || 0;
      if (newest ? t > bestT : t < bestT) { best = x; bestT = t; }
    });
    return best.m;
  }

  function renderThreads() {
    var groups = {};
    ordered().forEach(function (x) {
      var k = x.m.thread || "(no-thread)";
      (groups[k] = groups[k] || []).push(x);
    });
    var keys = Object.keys(groups).sort(function (a, b) {
      var la = pickEdge(groups[a], true).at;
      var lb = pickEdge(groups[b], true).at;
      return lb < la ? -1 : lb > la ? 1 : 0;
    });
    var html = '<div id="tlist">';
    keys.forEach(function (k) {
      var arr = groups[k];
      var open = pickEdge(arr, false);   // thread 的发起消息：标题与类型取它
      var latest = pickEdge(arr, true);  // 最近一条：用于排序与时间跨度
      var types = Array.from(new Set(arr.map(function (x) { return x.m.type || "unknown"; })));
      var subj = String(open.subject || "").replace(/^\[msg\]\s*\S*\s*/, "").trim();
      var hay = (subj + " " + arr.map(function (x) {
        return (x.m.body || "") + " " + x.m.from + " " + x.m.id;
      }).join(" ")).toLowerCase();
      html += '<div class="thread" data-thread="' + esc(k) + '" data-hay="' + esc(hay) + '">' +
        '<div class="thread-head"><span class="tarrow">&#9662;</span><b>' + esc(k) + "</b>" +
        '<span class="t-' + esc(open.type || "unknown") + '">' + esc(types.join(",")) + "</span>" +
        '<span style="color:var(--fg2);font-size:13px">' + esc(subj.slice(0, 120)) +
        (subj.length > 120 ? "…" : "") + "</span>" +
        '<span class="tcount">' + arr.length + " 条 · " +
        esc(fmtShort(open.at)) + " → " +
        esc(fmtShort(latest.at)) + "</span></div>" +
        '<div class="thread-body">' +
        arr.map(function (x) { return msgCard(x.m, x.i, false); }).join("") +
        "</div></div>";
    });
    html += "</div>";
    document.getElementById("threads").innerHTML = html;

    Array.prototype.forEach.call(
      document.querySelectorAll(".thread-head"), function (h) {
        h.addEventListener("click", function () {
          h.parentElement.classList.toggle("collapsed");
        });
      }
    );
  }

  function renderTimeline() {
    var html = '<div id="tline">';
    ordered().forEach(function (x) {
      html += msgCard(x.m, x.i, true);
    });
    document.getElementById("timeline").innerHTML = html + "</div>";
  }

  function messageInvolvesAgent(m, agentId) {
    if (!agentId) return true;
    if (m.from === agentId) return true;
    if (!m.to || !m.to.length) return true; // 空收件人按广播/未指定收件人处理
    var recipients = (m.to || []).concat(m.cc || []);
    return recipients.indexOf(agentId) >= 0 || recipients.indexOf("all") >= 0;
  }

  function renderChat() {
    var participants = document.getElementById("chat-participants");
    var totalMessages = state.data.messages.length;
    var buttons = '<button type="button" class="chat-agent' +
      (!state.chatAgent ? " active" : "") + '" data-agent="" aria-pressed="' +
      String(!state.chatAgent) + '"><span class="chat-agent-avatar" style="--agent-hue:210">群</span>' +
      '<span>全部消息</span><span class="chat-agent-count">' + totalMessages + '</span></button>';
    state.data.agents.forEach(function (agent) {
      var active = state.chatAgent === agent.id;
      var count = state.data.messages.filter(function (m) { return messageInvolvesAgent(m, agent.id); }).length;
      var hue = Array.from(String(agent.id || "unknown")).reduce(function (n, c) {
        return (n * 31 + c.charCodeAt(0)) % 360;
      }, 7);
      var initial = Array.from(String(agent.label || "?").replace(/[\s_-]+/g, "")).slice(0, 2).join("");
      buttons += '<button type="button" class="chat-agent' + (active ? " active" : "") +
        '" data-agent="' + esc(agent.id) + '" title="' + esc(agent.id) + '" aria-pressed="' + String(active) + '">' +
        '<span class="chat-agent-avatar" style="--agent-hue:' + hue + '">' + esc(initial) + '</span>' +
        '<span>' + esc(agent.label) + '</span><span class="chat-agent-count">' + count + '</span></button>';
    });
    participants.innerHTML = buttons;

    var all = state.data.messages.slice().sort(function (a, b) {
      return (Date.parse(a.at) || 0) - (Date.parse(b.at) || 0);
    });
    var query = state.chatSearch.trim().toLowerCase();
    var visible = all.filter(function (m) {
      return messageInvolvesAgent(m, state.chatAgent) &&
        (!query || [m.body, m.subject, m.from, m.id, m.thread].join(" ").toLowerCase().indexOf(query) >= 0);
    });
    var selected = state.chatAgent ? (state.agentsById[state.chatAgent] || {}).label : "全部消息";
    document.getElementById("chat-selection").textContent = "当前：" + selected;
    document.getElementById("chat-count").textContent = visible.length + " / " + all.length + " 条消息";

    var html = "";
    visible.forEach(function (m) {
      var author = state.agentsById[m.from];
      var label = author ? author.label : (m.from === "unknown" ? "未署名" : m.from);
      var initial = Array.from(String(label || "?").replace(/[\s_-]+/g, "")).slice(0, 2).join("");
      var hue = Array.from(String(m.from || "unknown")).reduce(function (n, c) {
        return (n * 31 + c.charCodeAt(0)) % 360;
      }, 7);
      var mine = state.chatAgent && m.from === state.chatAgent;
      var to = m.to && m.to.length ? m.to.map(function (id) {
        return state.agentsById[id] ? state.agentsById[id].label : id;
      }).join("、") : "全体";
      var cc = m.cc && m.cc.length ? m.cc.map(function (id) {
        return state.agentsById[id] ? state.agentsById[id].label : id;
      }).join("、") : "";
      var typeClass = TYPE_CLASS[m.type] || "t-unknown";
      var typeIcon = TYPE_ICON[m.type] || "·";
      var typeLabel = TYPE_CN[m.type] || m.type || "消息";
      html += '<article class="chat-row' + (mine ? " mine" : "") + '">' +
        '<div class="chat-avatar" style="--agent-hue:' + hue + '" aria-hidden="true">' + esc(initial) + '</div>' +
        '<div class="chat-content"><div class="chat-meta"><' + (author ? 'button type="button" class="chat-agent-name" data-chat-agent="' + esc(m.from) + '" aria-label="筛选 Agent ' + esc(label) + '，ID ' + esc(m.from) + '"' : 'span class="chat-agent-name"') + ' title="Agent ID: ' + esc(m.from) + '"><span class="chat-agent-label">' + esc(label) + '</span><span class="chat-agent-id">' + esc(m.from) + '</span></' + (author ? 'button' : 'span') + '>' +
        '<time>' + esc(fmtShort(m.at)) + '</time><span class="chat-type ' + typeClass + '" title="消息类型：' + esc(typeLabel) + '"><span class="chat-type-icon" aria-hidden="true">' + esc(typeIcon) + '</span>' + esc(typeLabel) + '</span></div>' +
        '<div class="chat-bubble"><div class="body markdown-body">' + renderMarkdown(m.body || m.subject || "") + '</div>' +
        '<div class="chat-details">' +
        '<span>发送给 ' + esc(to) + '</span>' + (cc ? '<span>抄送 ' + esc(cc) + '</span>' : "") +
        (m.thread ? '<span>会话 ' + esc(m.thread) + '</span>' : "") +
        (m.re ? '<a href="#m-' + esc(m.re) + '">↩ 回复 ' + esc(m.re) + '</a>' : "") +
        (m.id ? '<a href="#m-' + esc(m.id) + '">id ' + esc(m.id) + '</a>' : "") +
        '</div></div></div></article>';
    });
    document.getElementById("chat-messages").innerHTML = html ||
      '<div class="chat-empty">没有找到符合条件的消息</div>';
    updateChatLatestButton();
  }

  function isChatNearBottom() {
    var scroller = document.getElementById("chat-scroll");
    return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 96;
  }

  function updateChatLatestButton() {
    var scroller = document.getElementById("chat-scroll");
    var button = document.getElementById("chat-latest");
    if (!scroller || !button) return;
    var away = !isChatNearBottom();
    button.classList.toggle("at-latest", !away && !state.chatHasNew);
    button.classList.toggle("has-new", state.chatHasNew);
    document.getElementById("chat-latest-label").textContent = state.chatHasNew
      ? "有新消息，跳到最新" : (away ? "跳到最新消息" : "已到最新");
    document.getElementById("chat-bottom-hint").textContent = state.chatHasNew
      ? "新消息已到达" : (away ? "正在查看较早消息" : "已显示最新消息");
  }

  function scrollChatToLatest(takeFocus) {
    var scroller = document.getElementById("chat-scroll");
    if (!scroller) return;
    scroller.scrollTop = scroller.scrollHeight;
    if (takeFocus) scroller.focus({ preventScroll: true });
    state.chatHasNew = false;
    updateChatLatestButton();
  }

  function openChat() {
    if (!state.data) return;
    document.getElementById("chat-view").classList.remove("hidden");
    document.body.classList.add("chat-open");
    renderChat();
    scrollChatToLatest();
    document.getElementById("close-chat").focus();
  }

  function closeChat() {
    document.getElementById("chat-view").classList.add("hidden");
    document.body.classList.remove("chat-open");
    document.getElementById("open-chat").focus();
  }

  function applyFilter() {
    var s = state.search.trim().toLowerCase();
    var only = state.only;
    var vis = 0, total = 0;
    Array.prototype.forEach.call(
      document.querySelectorAll("#tlist .thread"), function (t) {
        total++;
        var ok = !s || t.getAttribute("data-hay").indexOf(s) >= 0;
        if (ok && only) {
          ok = t.querySelectorAll(".msg").length > 1;
        }
        t.classList.toggle("hidden", !ok);
        if (ok) vis++;
      }
    );
    var vism = 0;
    Array.prototype.forEach.call(
      document.querySelectorAll("#tline .msg"), function (m) {
        var ok = !s || m.textContent.toLowerCase().indexOf(s) >= 0;
        m.classList.toggle("hidden", !ok);
        if (ok) vism++;
      }
    );
    document.getElementById("cnt").textContent =
      (s || only)
        ? "显示 " + vis + " / " + total + " 个 thread，" + vism + " / " +
          state.data.messages.length + " 条消息"
        : total + " 个 thread · " + state.data.messages.length + " 条消息";
  }

  var PENDING_KEY = "bus-report.pending-collapsed";

  function readPendingCollapsed() {
    try { return window.localStorage.getItem(PENDING_KEY) === "1"; } catch (e) { return false; }
  }

  function writePendingCollapsed(v) {
    try { window.localStorage.setItem(PENDING_KEY, v ? "1" : "0"); } catch (e) { /* ignore */ }
  }

  // 「待结清」整栏可收起：收起后保留标题行与计数，展开后照常显示明细。
  function applyPendingCollapsed() {
    var body = document.getElementById("pending");
    var note = document.getElementById("p-note");
    var btn = document.getElementById("p-toggle");
    if (!body || !btn) return;
    var col = !!state.pendingCollapsed;
    body.style.display = col ? "none" : "";
    note.style.display = col ? "none" : "";
    btn.textContent = col
      ? "展开" + (state.pendingOpen ? " · " + state.pendingOpen : "")
      : "收起";
    btn.setAttribute("aria-expanded", col ? "false" : "true");
    btn.title = col ? "展开「待结清」" : "收起「待结清」，需要时再展开";
  }

  function renderPending() {
    var msgs = state.data.messages || [];
    var withExpect = msgs.filter(function (m) {
      return m.expect && m.expect !== "none";
    });
    var open = withExpect.filter(function (m) { return !m.settledBy; });
    open.sort(function (a, b) { return Date.parse(b.at) - Date.parse(a.at); });
    state.pendingOpen = open.length;
    var openExplicit = open.filter(expectIsExplicit).length;

    document.getElementById("p-count").textContent = withExpect.length
      ? "（" + open.length + " 未结清 / " + withExpect.length + " 条有反馈义务" +
        (openExplicit ? "，其中 " + openExplicit + " 条是发送方显式要求" : "") + "）"
      : "";

    var el = document.getElementById("pending");
    var note = document.getElementById("p-note");
    if (!withExpect.length) {
      el.innerHTML = '<div class="note" style="color:var(--fg3)">' +
        "当前数据里没有带 <code>expect</code> 的消息 —— 旧格式（v1）消息没有该字段，" +
        "只有 v2 起才会声明反馈义务。</div>";
      note.textContent = "";
      applyPendingCollapsed();
      return;
    }
    if (!open.length) {
      el.innerHTML = '<div class="card" style="border-color:#2f6b4a;color:#8ce99a">' +
        "✓ 全部已结清：所有 expect=ack/reply 的消息都有人用 <code>re: &lt;id&gt;</code> 回过。</div>";
    } else {
      el.innerHTML = open.map(function (m) {
        return '<div class="card" style="margin:8px 0;border-color:#6b4a2f">' +
          '<div class="msg-head">' +
          expChip(m) +
          '<span class="t-' + esc(m.type || "unknown") + '">' +
          esc(TYPE_CN[m.type] || m.type) + "</span>" +
          '<span class="pri pri-' + esc(m.priority || "none") + '">' +
          esc(PRI_CN[m.priority] || m.priority || "—") + "</span>" +
          '<a class="mid mid-jump" href="#m-' + esc(m.id) +
          '" title="跳到时间线里的这条消息">id ' + esc(m.id) + " ↗</a>" +
          '<span class="time">' + esc(fmtTime(m.at)) + "</span></div>" +
          '<div class="msg-route">' + chip(m.from) + '<span class="arrow">&rarr;</span>' +
          (m.to && m.to.length ? m.to.map(chip).join("") : '<span class="chip none">广播</span>') +
          "</div>" +
          (m.reply_by
            ? '<div class="ref">期望回复：<b>' + esc(m.reply_by) + "</b></div>"
            : "") +
          (multiGen() ? '<div class="ref">代：' + esc(m.generation) + "</div>" : "") +
          '<div class="ref" style="color:var(--fg2)">' +
          esc(String(m.subject || "").slice(0, 180)) + "</div></div>";
      }).join("");
    }
    note.innerHTML = "判定规则：<code>expect=ack/reply</code> 的消息若被后来消息的 " +
      "<code>re: &lt;id&gt;</code> 引用即视为结清；欠回复会在 aw.py 里挡住 <code>claim next</code> / " +
      "<code>agent exit</code>。<br>" +
      "标 <span class=\"exp exp-done\" style=\"font-size:11px\">显式</span> 的是" +
      "<b>发送方覆盖了类型默认值</b>——例如 <code>fyi</code> 默认 <code>expect=none</code>，" +
      "但发送时用了 <code>--expect ack</code>，于是它也会进待结清。" +
      "若认为某些知会不该要求回执，应改发送端，而不是把这类消息从列表里过滤掉。";
    applyPendingCollapsed();
  }

  function renderAll() {
    var d = state.data;
    state.agentsById = {};
    d.agents.forEach(function (a) { state.agentsById[a.id] = a; });

    document.getElementById("hd-meta").innerHTML =
      "<b>" + esc(d.meta.ref) + "</b> · <b>" + d.meta.counts.messages +
      "</b> 条消息 · <b>" + d.meta.counts.threads + "</b> 个 thread · <b>" +
      d.meta.counts.agents + "</b> 个参与 Agent · 跨度 <b>" +
      esc(fmtTime(d.meta.range.from).slice(0, 16)) + "</b> → <b>" +
      esc(fmtTime(d.meta.range.to).slice(0, 16)) + "</b>" +
      (d.meta.counts.openExpect ? " · 待结清 <b>" + d.meta.counts.openExpect + "</b>" : "");

    document.getElementById("s-msg").textContent = d.meta.counts.messages;
    document.getElementById("s-thread").textContent = d.meta.counts.threads;
    document.getElementById("s-agent").textContent = d.meta.counts.agents;
    var top = d.agents[0];
    document.getElementById("s-top").textContent = top ? top.label : "—";
    document.getElementById("s-open").textContent = d.meta.counts.openExpect == null
      ? "—" : d.meta.counts.openExpect;

    document.getElementById("s-note").innerHTML =
      "数据来自 git <code>" + esc(d.meta.ref) + "</code> 分支，commit <code>" +
      esc(String(d.meta.tip).slice(0, 12)) + "</code>；消息体即 commit message。" +
      "页面所有时间均为<b>北京时间（UTC+8）</b>，时间线以 <b>commit 提交时间</b>为准；" +
      "消息体里手写的 <code>at:</code> 若与之不一致会标 <span class=\"decl\">*</span>（悬停看两者）。" +
      (state.source === "live"
        ? "本页由本地服务实时驱动：点「刷新数据」会让服务端增量 fetch 一次 bus 再重绘，页面不重载。"
        : "本页优先加载同目录的 <code>" + esc(d.meta.dataFile) +
          "</code>，加载失败才回退内嵌快照 —— 跑 <code>bus-report serve</code> 即可开启实时刷新。");

    var badge = document.getElementById("src-badge");
    var live = state.source === "live";
    var builtAt = Date.parse(d.meta.generatedAt);
    var ageHours = Number.isNaN(builtAt) ? 0 : (Date.now() - builtAt) / 3600000;
    badge.textContent = "数据源：" + (live
      ? "实时（服务端 fetch " + (d.meta.remote || d.meta.ref) + "）"
      : state.source === "external"
        ? "外部 " + d.meta.dataFile + "（已是最新）"
        : "内嵌快照（外部文件未加载）") +
      // 非实时 + 快照较旧 → 明确告诉用户这是旧页面，别再怀疑功能没生效
      (!live && ageHours >= 0.5 ? " · 快照 " + (ageHours >= 24
        ? Math.round(ageHours / 24) + " 天前"
        : Math.round(ageHours) + " 小时前") : "");
    badge.className = "badge " +
      (live ? "live" : ageHours >= 0.5 ? "stale" : state.source === "external" ? "live" : "stale");
    document.getElementById("gen-badge").textContent =
      "生成时间：" + fmtTime(d.meta.generatedAt).slice(0, 19) + "（北京时间）" +
      (!live && ageHours >= 0.5 ? " · 点「刷新数据」或重开面板取最新" : "");

    renderAgents();
    renderStats();
    renderPending();
    renderThreads();
    renderTimeline();
    applyFilter();
    if (!document.getElementById("chat-view").classList.contains("hidden")) renderChat();

    // 直接带 #m-xxx 打开时，锚点元素在渲染前并不存在，浏览器不会重试——
    // 这里补一次定位，纯浏览器（file:// / 静态托管）也能跳。
    if (location.hash && location.hash.indexOf("#m-") === 0) {
      setTimeout(function () { jumpToHash(location.hash, false); }, 30);
    }
  }

  // ── 锚点跳转（不依赖浏览器原生的 #hash 时序）
  function targetOfHash(hash) {
    if (!hash || String(hash).indexOf("#m-") !== 0) return null;
    return document.getElementById(String(hash).slice(1));
  }

  // 目标可能被搜索过滤藏起来了，跳之前先清掉过滤，否则滚到的是隐藏元素
  function revealTarget(el) {
    if (!el.classList.contains("hidden")) return;
    var q = document.getElementById("q");
    if (q && q.value) { q.value = ""; state.search = ""; }
    var ot = document.getElementById("onlyThreads");
    if (ot && ot.checked) { ot.checked = false; state.only = false; }
    applyFilter();
  }

  function jumpToHash(hash, smooth) {
    var el = targetOfHash(hash);
    if (!el) return false;
    revealTarget(el);
    el.classList.add("jump-flash");
    setTimeout(function () { el.classList.remove("jump-flash"); }, 1800);
    var top = el.getBoundingClientRect().top + (window.pageYOffset || 0) - 12;
    // 距离很远时用瞬时跳转：几千条消息里平滑滚动要好几秒，反而像没反应
    var far = Math.abs(top - (window.pageYOffset || 0)) > 3000;
    try {
      window.scrollTo({ top: top, behavior: smooth && !far ? "smooth" : "auto" });
    } catch (e) {
      window.scrollTo(0, top); // 老浏览器不支持 options 对象
    }
    return true;
  }

  // 捕获阶段拦下所有 #m- 链接：清过滤 + 定位 + 高亮 + 可分享的 hash
  document.addEventListener("click", function (ev) {
    var node = ev.target;
    while (node && node !== document) {
      if (node.tagName === "A") {
        var href = node.getAttribute ? node.getAttribute("href") || "" : "";
        if (href.indexOf("#m-") === 0) {
          ev.preventDefault();
          var chatView = document.getElementById("chat-view");
          if (chatView && !chatView.classList.contains("hidden")) closeChat();
          if (location.hash !== href) {
            if (window.history && history.replaceState) history.replaceState(null, "", href);
            else location.hash = href;
          }
          jumpToHash(href, true);
          return;
        }
      }
      node = node.parentNode;
    }
  }, true);

  // 按需注入同目录数据文件（file:// / 纯静态托管时的数据来源）
  function injectDataScript(bust) {
    return new Promise(function (resolve) {
      var s = document.createElement("script");
      s.src = "./" + (window.__BUS_DATA_FILE__ || "bus-data.js") +
        (bust ? "?t=" + Date.now() : "");
      s.onload = function () { resolve(true); };
      s.onerror = function () { resolve(false); };
      document.head.appendChild(s);
    });
  }

  function load() {
    // 1) 有 bus-report serve 在跑：直接走实时接口
    fetch("api/bus", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (d) {
        if (!d || !d.messages) throw new Error("数据为空");
        applyData(d, "live");
      })
      // 2) 没有服务（file:// 或纯静态服务）：退回数据文件 / 内嵌快照
      .catch(function () {
        return injectDataScript(false).then(loadSnapshot, loadSnapshot);
      });
  }

  function applyData(data, source) {
    var chatWasOpen = !document.getElementById("chat-view").classList.contains("hidden");
    var keepAtBottom = chatWasOpen && isChatNearBottom();
    var previousCount = state.data ? state.data.messages.length : 0;
    var newCount = data && data.messages ? data.messages.length : 0;
    state.data = data;
    state.source = source;
    document.getElementById("err").style.display = "none";
    renderAll();
    if (chatWasOpen) {
      state.chatHasNew = !keepAtBottom && newCount > previousCount;
      if (keepAtBottom) scrollChatToLatest();
      else updateChatLatestButton();
    }
  }

  function loadSnapshot() {
    var picked = pickData();
    if (!picked.data) {
      var err = document.getElementById("err");
      err.style.display = "block";
      err.textContent = "未能载入数据：/api/bus 不可用，外部 bus-data.js 不可达，" +
        "内嵌快照也解析失败。请重新运行 bus-report build 或 serve。";
      return;
    }
    applyData(picked.data, picked.source);
  }

  // ── 交互绑定
  var q = document.getElementById("q");
  var ot = document.getElementById("onlyThreads");

  function onSearch() { state.search = q.value || ""; applyFilter(); }
  function onOnly() { state.only = !!ot.checked; applyFilter(); }

  var dc = document.getElementById("descOrder");
  function onOrder() {
    state.desc = !!dc.checked;
    renderThreads();
    renderTimeline();
    applyFilter();
  }

  ["input", "keyup", "search", "change"].forEach(function (ev) {
    q.addEventListener(ev, onSearch);
  });
  ot.addEventListener("change", onOnly);
  dc.addEventListener("change", onOrder);

  // 「待结清」收起状态：本机记住，刷新后保持
  var pTog = document.getElementById("p-toggle");
  state.pendingCollapsed = readPendingCollapsed();
  pTog.addEventListener("click", function () {
    state.pendingCollapsed = !state.pendingCollapsed;
    writePendingCollapsed(state.pendingCollapsed);
    applyPendingCollapsed();
  });

  // 值轮询兜底：覆盖粘贴 / IME / 自动化直接赋值 .value 而不派发 input 的情况
  setInterval(function () {
    if ((q.value || "") !== state.search) onSearch();
  }, 250);

  function refreshData() {
    if (state.refreshing) return;
    state.refreshing = true;
    var dashboardButton = document.getElementById("reload");
    var chatButton = document.getElementById("chat-reload");
    var status = document.getElementById("chat-refresh-status");
    dashboardButton.disabled = true;
    chatButton.disabled = true;
    dashboardButton.textContent = "拉取中…";
    chatButton.textContent = "刷新中…";
    status.textContent = "正在同步消息…";

    var finish = function (message) {
      state.refreshing = false;
      dashboardButton.disabled = false;
      chatButton.disabled = false;
      dashboardButton.textContent = "刷新数据";
      chatButton.textContent = "刷新消息";
      status.textContent = message;
    };

    fetch("api/bus?refresh=1", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (d) {
        if (!d || !d.messages) throw new Error("数据为空");
        applyData(d, "live");
        finish("消息已更新");
      })
      // 服务端接口不可用（纯静态托管 / file://）：退回同目录快照。
      .catch(function () {
        return injectDataScript(true).then(function (loaded) {
          if (!loaded) {
            finish("刷新失败，仍显示当前消息");
            return;
          }
          loadSnapshot();
          finish("已重新加载本地数据");
        });
      })
      .catch(function () {
        finish("刷新失败，仍显示旧消息");
      });
  }

  document.getElementById("reload").addEventListener("click", refreshData);
  document.getElementById("chat-reload").addEventListener("click", refreshData);
  document.getElementById("chat-scroll").addEventListener("scroll", function () {
    updateChatLatestButton();
  }, { passive: true });
  document.getElementById("chat-latest").addEventListener("click", function () {
    scrollChatToLatest(true);
  });

  document.getElementById("open-chat").addEventListener("click", openChat);
  document.getElementById("close-chat").addEventListener("click", closeChat);
  function selectChatAgent(agentId) {
    state.chatAgent = agentId || "";
    renderChat();
    scrollChatToLatest();
  }

  document.getElementById("chat-participants").addEventListener("click", function (event) {
    var button = event.target.closest("button[data-agent]");
    if (!button) return;
    selectChatAgent(button.getAttribute("data-agent"));
  });
  document.getElementById("chat-messages").addEventListener("click", function (event) {
    var button = event.target.closest("button[data-chat-agent]");
    if (!button) return;
    selectChatAgent(button.getAttribute("data-chat-agent"));
  });
  document.getElementById("chat-search").addEventListener("input", function () {
    state.chatSearch = this.value;
    renderChat();
    scrollChatToLatest();
  });
  document.addEventListener("keydown", function (event) {
    var chatView = document.getElementById("chat-view");
    if (chatView.classList.contains("hidden")) return;
    if (event.key === "Escape") {
      closeChat();
      return;
    }
    if (event.key === "Tab") {
      var focusable = chatView.querySelectorAll('button:not(:disabled), input:not(:disabled)');
      if (!focusable.length) return;
      var first = focusable[0], last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }
  });

  var backToTop = document.getElementById("back-to-top");
  var updateBackToTop = function () {
    var visible = (window.pageYOffset || document.documentElement.scrollTop || 0) > 300;
    backToTop.classList.toggle("visible", visible);
    backToTop.setAttribute("aria-hidden", String(!visible));
  };
  window.addEventListener("scroll", updateBackToTop, { passive: true });
  backToTop.addEventListener("click", function () {
    var reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({ top: 0, behavior: reducedMotion ? "auto" : "smooth" });
  });
  updateBackToTop();

  load();
})();
</script>
</body>
</html>
